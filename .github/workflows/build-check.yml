name: Build-Test

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - name: Seiten im Browser prüfen (DE + FR)
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort &) 
          sleep 4
          node scripts/check-fr.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
      - name: Screenshots auf Hilfszweig ablegen
        if: always()
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "screenshots ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
